<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание занятий</title>
<style>
  :root{
    --bg:#f5f6fb;
    --card:#ffffff;
    --text:#1e2433;
    --muted:#667085;
    --num:#cbd0de;
    --accent:#5b6cf0;
    --accent-dark:#4453d1;
    --now:#eceeff;
    --warn-bg:#fff3d6;
    --warn-text:#7a5b12;
    --shadow:0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c;
      --card:#1b1f2a;
      --text:#e8ebf2;
      --muted:#9ba4b8;
      --num:#4b5266;
      --accent:#8a97ff;
      --accent-dark:#b3bcff;
      --now:#252a4a;
      --warn-bg:#3a3118;
      --warn-text:#f0d58a;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;line-height:1.4;max-width:560px;margin:0 auto;padding:16px 16px 32px;background:var(--bg);color:var(--text)}
  .nav{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
  .nav h1{flex:1;text-align:center;margin:0;font-size:20px;line-height:1.25}
  .nav button{font-size:22px;line-height:1;width:44px;height:44px;border:none;border-radius:12px;background:var(--card);color:var(--accent);box-shadow:var(--shadow);cursor:pointer}
  #today{display:block;margin:0 auto 4px;font-size:14px;border:none;background:none;color:var(--accent);padding:8px 12px;cursor:pointer}
  #today[hidden]{display:none}
  select{font-size:16px;padding:10px 12px;margin:8px 0 6px;width:100%;border:1px solid var(--num);border-radius:10px;background:var(--card);color:var(--text)}
  #status{font-size:13px;color:var(--muted);margin:0 2px 14px}
  .warn{background:var(--warn-bg);color:var(--warn-text);padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:12px}
  .empty{color:var(--muted);padding:32px 0;text-align:center}
  .pair{display:flex;gap:14px;background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .pair.now{background:var(--now);box-shadow:inset 5px 0 0 var(--accent)}
  .num{font-size:20px;font-weight:bold;color:var(--num);width:20px;flex:none;text-align:center}
  .pair.now .num{color:var(--accent)}
  .content{flex:1;min-width:0}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .time{font-size:22px;font-weight:bold}
  .room{font-size:22px;font-weight:bold;color:var(--accent);white-space:nowrap}
  .room small{font-size:13px;font-weight:normal;color:var(--muted)}
  .subject{margin-top:6px}
  .teacher{margin-top:2px;font-size:13px;color:var(--muted)}
  .brk{margin-top:8px;font-size:13px;color:var(--muted)}
  .left{margin-top:8px;font-size:13px;color:var(--accent-dark)}
  .left + .left{margin-top:2px}
  .left b{font-size:16px}
</style>
</head>
<body>
<div class="nav">
  <button id="prev" aria-label="Предыдущий день">‹</button>
  <h1 id="title">Расписание</h1>
  <button id="next" aria-label="Следующий день">›</button>
</div>
<button id="today" hidden>Вернуться к сегодняшнему дню</button>
<select id="group" aria-label="Выберите свою группу"></select>
<div id="status">Загружаем расписание...</div>
<div id="app"></div>

<script>
const CSV_LINK = "https://docs.google.com/spreadsheets/d/1bADiWZSKqhi4p92eLVYF-Xd2HOK4TA_-Di2C8bB2Ufk/gviz/tq?tqx=out:csv&gid=1324664116";
const REFRESH_MS = 120000;
const TICK_MS = 30000;
const KEY_CSV = "schedule_csv";
const KEY_GROUP = "schedule_group";
const WEEKDAYS = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const DAY_RE = /^\s*(понедельник|вторник|среда|четверг|пятница|суббота|воскресенье)\s+(\d{2}\.\d{2}\.\d{4})/i;

let curRows = null;
let curCol = 0;
let dayOffset = 0;

document.getElementById("prev").onclick = () => { dayOffset--; draw(); };
document.getElementById("next").onclick = () => { dayOffset++; draw(); };
document.getElementById("today").onclick = () => { dayOffset = 0; draw(); };

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; } else q = false;
      } else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  row.push(cell);
  rows.push(row);
  return rows;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function getGroups(rows) {
  const head = rows[0] || [];
  const groups = [];
  for (let c = 3; c < head.length; c++) {
    const n = (head[c] || "").trim();
    if (n && !/^ауд(итория)?\.?$/i.test(n)) groups.push({ name: n, col: c });
  }
  if (groups.length) return groups;
  return [3, 5, 7, 9].map((c, i) => ({ name: "Группа " + (i + 1), col: c }));
}

function parseDays(rows) {
  const days = [];
  rows.forEach((row, i) => {
    if (i === 0) return;
    const m = (row[0] || "").match(DAY_RE);
    if (m) days.push({ name: m[1].toLowerCase(), date: m[2], rows: [] });
    if (days.length) days[days.length - 1].rows.push(row);
  });
  return days;
}

function splitLesson(text) {
  const parts = text.replace(/\s+/g, " ").split(/ преподаватель /i);
  return { subject: parts[0].trim(), teacher: (parts[1] || "").trim() };
}

const fixTime = s => (s || "").replace(/\./g, ":");

function toMin(s) {
  const p = (s || "").trim().split(/[.:]/);
  return (+p[0]) * 60 + (+p[1] || 0);
}

function range(t) {
  const p = (t || "").split("-");
  return [toMin(p[0]), toMin(p[1] || p[0])];
}

function fmtMin(n) {
  return n >= 60 ? Math.floor(n / 60) + " ч " + (n % 60) + " мин" : n + " мин";
}

function buildItems(day) {
  const items = [];
  for (let i = 0; i < day.rows.length; i += 2) {
    const cells = day.rows.slice(i, i + 2).map(r => ({
      time: (r[2] || "").trim(),
      text: (r[curCol] || "").trim(),
      room: (r[curCol + 1] || "").trim()
    }));
    const filled = cells.filter(c => c.text);
    if (!filled.length) continue;

    const same = cells.length === 2 && cells[0].text &&
      cells[0].text === cells[1].text && cells[0].room === cells[1].room;

    if (same) {
      const a = cells[0], b = cells[1];
      const aEnd = range(a.time)[1];
      const bStart = range(b.time)[0];
      items.push({
        ...a,
        label: fixTime(a.time.split("-")[0]) + "-" + fixTime(b.time.split("-")[1]),
        start: range(a.time)[0],
        end: range(b.time)[1],
        brk: bStart > aEnd ? [aEnd, bStart] : null,
        brkLabel: fixTime(a.time.split("-")[1]) + "-" + fixTime(b.time.split("-")[0])
      });
    } else {
      filled.forEach(c => {
        const r = range(c.time);
        items.push({ ...c, label: fixTime(c.time), start: r[0], end: r[1], brk: null });
      });
    }
  }
  return items;
}

function draw() {
  if (!curRows) return;
  const app = document.getElementById("app");
  app.innerHTML = "";

  const real = new Date();
  const view = new Date(real);
  view.setDate(view.getDate() + dayOffset);
  const isToday = dayOffset === 0;
  const dayName = WEEKDAYS[view.getDay()];
  const dateStr = String(view.getDate()).padStart(2, "0") + "." +
    String(view.getMonth() + 1).padStart(2, "0") + "." + view.getFullYear();

  document.getElementById("title").textContent =
    dayName[0].toUpperCase() + dayName.slice(1) + ", " + dateStr;
  document.getElementById("today").hidden = isToday;

  const day = parseDays(curRows).find(d => d.name === dayName);
  if (!day) {
    app.appendChild(el("div", "empty", "На этот день в таблице нет занятий."));
    return;
  }
  if (day.date !== dateStr) {
    app.appendChild(el("div", "warn",
      "В таблице для этого дня указана дата " + day.date + ". Возможно, расписание на эту неделю еще не обновили."));
  }

  const items = buildItems(day);
  if (!items.length) {
    app.appendChild(el("div", "empty", "У вашей группы в этот день нет занятий."));
    return;
  }

  const nowMin = real.getHours() * 60 + real.getMinutes() + real.getSeconds() / 60;
  const current = isToday
    ? items.find(c => c.start <= nowMin && nowMin < c.end) || null
    : null;
  const next = isToday && !current
    ? items.filter(c => c.start > nowMin).sort((a, b) => a.start - b.start)[0] || null
    : null;

  items.forEach((c, idx) => {
    const isNow = c === current;
    const card = el("div", "pair" + (isNow ? " now" : ""));
    card.appendChild(el("div", "num", String(idx + 1)));

    const content = el("div", "content");
    const top = el("div", "top");
    top.appendChild(el("div", "time", c.label));
    if (c.room) {
      top.appendChild(el("div", "room", c.room));
    }
    content.appendChild(top);

    const l = splitLesson(c.text);
    content.appendChild(el("div", "subject", l.subject));
    if (l.teacher) content.appendChild(el("div", "teacher", l.teacher));
    if (c.brk) content.appendChild(el("div", "brk", "Перемена " + c.brkLabel));

    if (isNow) {
      const left = el("div", "left");
      left.append("До конца пары осталось ", el("b", "", String(Math.ceil(c.end - nowMin))), " мин");
      content.appendChild(left);

      if (c.brk && nowMin < c.brk[0]) {
        const b = el("div", "left");
        b.append("Перемена начнется через ", el("b", "", fmtMin(Math.ceil(c.brk[0] - nowMin))));
        content.appendChild(b);
      } else if (c.brk && nowMin < c.brk[1]) {
        const b = el("div", "left");
        b.append("Сейчас перемена, она закончится через ", el("b", "", fmtMin(Math.ceil(c.brk[1] - nowMin))));
        content.appendChild(b);
      }
    } else if (c === next) {
      const left = el("div", "left");
      left.append("Эта пара начнется через ", el("b", "", fmtMin(Math.ceil(c.start - nowMin))));
      content.appendChild(left);
    }

    card.appendChild(content);
    app.appendChild(card);
  });
}

function render(csv) {
  const rows = parseCSV(csv);
  const groups = getGroups(rows);
  const sel = document.getElementById("group");
  let saved = localStorage.getItem(KEY_GROUP);
  if (!groups.some(g => String(g.col) === saved)) saved = String(groups[0].col);
  sel.innerHTML = "";
  groups.forEach(g => {
    const o = document.createElement("option");
    o.value = g.col;
    o.textContent = g.name;
    sel.appendChild(o);
  });
  sel.value = saved;
  curRows = rows;
  curCol = +sel.value;
  sel.onchange = () => {
    localStorage.setItem(KEY_GROUP, sel.value);
    curCol = +sel.value;
    draw();
  };
  draw();
}

function setStatus(s) {
  document.getElementById("status").textContent = s;
}

async function load() {
  try {
    const res = await fetch(CSV_LINK, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    localStorage.setItem(KEY_CSV, text);
    render(text);
    const t = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    setStatus("Обновлено в " + t);
  } catch (e) {
    setStatus("Не удалось обновить расписание. Показываем сохраненную версию.");
  }
}

const cached = localStorage.getItem(KEY_CSV);
if (cached) {
  render(cached);
  setStatus("Показываем сохраненную версию, проверяем обновления...");
}
load();
setInterval(load, REFRESH_MS);
setInterval(draw, TICK_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
